<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Mental Health Platform</title>
    <link rel="stylesheet" href="sign-up.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
        rel="stylesheet">
    <script>
        if (window.location.port) {
            window.location.replace('/sign-up');
        }
    </script>
</head>

<body>
    <main class="signup-container">

        <!-- Sisi Kiri: Poster -->
        <section class="sign-up-left">
            <div class="sign-up-poster">
                <img src="../Assets/Picture/Signup Poster.png" alt="Signup Poster">
            </div>
        </section>

        <!-- Sisi Kanan: Form -->
        <section class="sign-up-right">
            <div class="up-text">
                <img src="../Assets/Icon/solar_user-plus-broken.png" alt="Icon User">
                <div class="header-content">
                    <h1>Mulai Perjalananmu</h1>
                    <p>Buat akun untuk mulai memahami dan mengelola kecemasanmu.</p>
                </div>
            </div>

            <!-- Formulir Input -->
            <div class="input-group">
                <label for="fullname">Nama Lengkap <span class="required">*</span></label>
                <input type="text" id="fullname" placeholder="Masukkan nama lengkap anda">
            </div>

            <div class="input-group">
                <label for="email">Alamat email <span class="required">*</span></label>
                <input type="email" id="email" placeholder="Masukkan alamat email kamu disini">
            </div>

            <div class="input-group">
                <label for="password">Kata Sandi <span class="required">*</span></label>
                <input type="password" id="password" placeholder="Masukkan kata sandi kamu disini">
            </div>

            <div class="input-group">
                <label for="confirm-password">Konfirmasi Kata Sandi <span class="required">*</span></label>
                <input type="password" id="confirm-password" placeholder="Konfirmasi kata sandi kamu">
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="terms">
                <label for="terms">Saya setuju dengan <span class="hi"><a href="#" class="link-blue">Ketentuan &
                            Kebijakan Privasi</a></span></label>
            </div>

            <!-- Tombol & Aksi -->
            <button type="submit" class="btn-daftar">Daftar</button>

            <div class="divider">
                <span>Atau</span>
            </div>

            <button type="button" class="btn-google">
                <img src="../Assets/Icon/devicon_google.png" alt="Google Icon">
                <span>Masuk dengan Google</span>
            </button>

            <p class="login-redirect">
                Sudah memiliki akun? <span class="highlight"><a href="#" class="link-blue">Masuk di sini</a></span>
            </p>
        </section>

    </main>
</body>

</html>
